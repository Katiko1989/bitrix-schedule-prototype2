<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Битрикс24 — График планирований сотрудников</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background-color: #eef2f5; margin: 0; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    .vacation-pattern {
      background-image: repeating-linear-gradient(45deg, rgba(245, 158, 11, 0.15), rgba(245, 158, 11, 0.15) 10px, rgba(245, 158, 11, 0.25) 10px, rgba(245, 158, 11, 0.25) 20px);
    }
    .sick-pattern {
      background-image: repeating-linear-gradient(45deg, rgba(239, 68, 68, 0.15), rgba(239, 68, 68, 0.15) 10px, rgba(239, 68, 68, 0.25) 10px, rgba(239, 68, 68, 0.25) 20px);
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo } = React;

    const initialDepartments = [
      {
        id: 'dep-1',
        name: 'Отдел пусконаладочных работ (ПНР)',
        employees: [
          { id: 'emp-1', name: 'Алексей Смирнов', role: 'Ведущий инженер ПНР', avatar: 'АС', color: 'bg-blue-600' },
          { id: 'emp-2', name: 'Дмитрий Ковалев', role: 'Инженер слаботочных систем', avatar: 'ДК', color: 'bg-emerald-600' },
          { id: 'emp-3', name: 'Иван Сергеев', role: 'Младший инженер', avatar: 'ИС', color: 'bg-amber-600' }
        ]
      },
      {
        id: 'dep-2',
        name: 'Сервисно-технический отдел',
        employees: [
          { id: 'emp-4', name: 'Максим Васильев', role: 'Инженер ТО и сервиса', avatar: 'МВ', color: 'bg-purple-600' },
          { id: 'emp-5', name: 'Сергей Новиков', role: 'Специалист выездной техподдержки', avatar: 'СН', color: 'bg-teal-600' },
          { id: 'emp-6', name: 'Артем Федоров', role: 'Инженер-диагност', avatar: 'АФ', color: 'bg-rose-600' }
        ]
      }
    ];

    const daysData = [
      { day: 2, label: '02 Пн', isWeekend: false, dateStr: '2026-11-02' },
      { day: 3, label: '03 Вт', isWeekend: false, isToday: true, dateStr: '2026-11-03' },
      { day: 4, label: '04 Ср', isWeekend: false, dateStr: '2026-11-04' },
      { day: 5, label: '05 Чт', isWeekend: false, dateStr: '2026-11-05' },
      { day: 6, label: '06 Пт', isWeekend: false, dateStr: '2026-11-06' },
      { day: 7, label: '07 Сб', isWeekend: true, dateStr: '2026-11-07' },
      { day: 8, label: '08 Вс', isWeekend: true, dateStr: '2026-11-08' },
      { day: 9, label: '09 Пн', isWeekend: false, dateStr: '2026-11-09' },
      { day: 10, label: '10 Вт', isWeekend: false, dateStr: '2026-11-10' },
      { day: 11, label: '11 Ср', isWeekend: false, dateStr: '2026-11-11' },
      { day: 12, label: '12 Чт', isWeekend: false, dateStr: '2026-11-12' },
      { day: 13, label: '13 Пт', isWeekend: false, dateStr: '2026-11-13' },
      { day: 14, label: '14 Сб', isWeekend: true, dateStr: '2026-11-14' },
      { day: 15, label: '15 Вс', isWeekend: true, dateStr: '2026-11-15' }
    ];

    const initialEvents = [
      {
        id: 'plan-101',
        type: 'planning',
        title: 'Шеф-монтаж LED-видеостены и калибровка',
        employeeId: 'emp-1',
        coEmployeeIds: ['emp-3'],
        startDate: '2026-11-02',
        endDate: '2026-11-04',
        startDay: 2,
        endDay: 4,
        deal: { id: 1042, title: 'Сделка №1042 — Конгресс-холл «Авантаж»' },
        company: 'ПАО «МегаКорп»',
        task: { id: 4501, title: 'Выезд инженера: монтаж NovaStar', status: 'В работе', overdue: false },
        trip: { id: 3912, status: 'Согласована (БП 39)', number: 'КМ-11/04' },
        report: { id: 25901, status: 'предоставлен, задача выполняется', date: '04.11.2026', badge: 'bg-blue-100 text-blue-800 border-blue-300' },
        description: 'Комплексная пусконаладка контроллеров NovaStar, юстировка панелей и настройка пресетов.',
        needAct: true
      },
      {
        id: 'plan-102',
        type: 'planning',
        title: 'Аварийная замена коммутатора Dante',
        employeeId: 'emp-2',
        coEmployeeIds: [],
        startDate: '2026-11-03',
        endDate: '2026-11-03',
        startDay: 3,
        endDay: 3,
        deal: { id: 1088, title: 'Сделка №1088 — Ситуационный центр ДИТ' },
        company: 'ГБУ «ИнфоТех»',
        task: { id: 4508, title: 'Срочный выезд: сбой синхронизации аудио', status: 'Просрочена', overdue: true },
        trip: null,
        report: { id: null, status: 'не предоставлен', date: null, badge: 'bg-rose-100 text-rose-800 border-rose-300' },
        description: 'Диагностика потери пакетов в сети Dante, замена резервного свитча Cisco SG350.',
        needAct: true
      },
      {
        id: 'plan-103',
        type: 'planning',
        title: 'Плановое ТО аудиовизуального комплекса',
        employeeId: 'emp-4',
        coEmployeeIds: ['emp-5'],
        startDate: '2026-11-05',
        endDate: '2026-11-06',
        startDay: 5,
        endDay: 6,
        deal: { id: 980, title: 'Сделка №980 — Годовой контракт ТО Бизнес-Центр' },
        company: 'ООО «Капитал-Сити»',
        task: { id: 4520, title: 'Проведение квартального регламента ТО-2', status: 'Завершена', overdue: false },
        trip: null,
        report: { id: 25904, status: 'принят', date: '06.11.2026', badge: 'bg-emerald-100 text-emerald-800 border-emerald-300' },
        description: 'Чистка фильтров проекторов, проверка затяжки рэковых стоек, юстировка микрофонных массивов.',
        needAct: true
      },
      {
        id: 'abs-201',
        type: 'vacation',
        title: 'Оплачиваемый отпуск',
        employeeId: 'emp-1',
        startDate: '2026-11-09',
        endDate: '2026-11-15',
        startDay: 9,
        endDay: 15,
        description: 'Штатный ежегодный отпуск (График отсутствий Битрикс24)'
      },
      {
        id: 'abs-202',
        type: 'sick',
        title: 'Больничный лист',
        employeeId: 'emp-6',
        startDate: '2026-11-02',
        endDate: '2026-11-06',
        startDay: 2,
        endDay: 6,
        description: 'Электронный листок нетрудоспособности'
      }
    ];

    function App() {
      const [departments] = useState(initialDepartments);
      const [events, setEvents] = useState(initialEvents);
      const [viewMode, setViewMode] = useState('Неделя');
      const [collapsedDeps, setCollapsedDeps] = useState({});
      const [selectedEvent, setSelectedEvent] = useState(null);
      const [isCreateOpen, setIsCreateOpen] = useState(false);
      const [dealFilterMode, setDealFilterMode] = useState(false);
      const [searchQuery, setSearchQuery] = useState('');

      const [formEmployee, setFormEmployee] = useState('emp-1');
      const [formStartDate, setFormStartDate] = useState('2026-11-03');
      const [formEndDate, setFormEndDate] = useState('2026-11-04');
      const [formDeal, setFormDeal] = useState('Сделка №1042 — Конгресс-холл «Авантаж»');
      const [formTitle, setFormTitle] = useState('');
      const [conflictOverride, setConflictOverride] = useState(false);

      const toggleDep = (depId) => {
        setCollapsedDeps(prev => ({ ...prev, [depId]: !prev[depId] }));
      };

      const conflictCheck = useMemo(() => {
        const start = parseInt(formStartDate.split('-')[2], 10);
        const end = parseInt(formEndDate.split('-')[2], 10);

        const overlappingPlan = events.find(e => 
          e.type === 'planning' &&
          (e.employeeId === formEmployee || (e.coEmployeeIds && e.coEmployeeIds.includes(formEmployee))) &&
          !(end < e.startDay || start > e.endDay)
        );

        const overlappingAbsence = events.find(e => 
          (e.type === 'vacation' || e.type === 'sick') &&
          e.employeeId === formEmployee &&
          !(end < e.startDay || start > e.endDay)
        );

        return {
          hardConflict: overlappingPlan ? `Сотрудник уже занят в планировании «${overlappingPlan.title}» (${overlappingPlan.startDate} — ${overlappingPlan.endDate})` : null,
          absenceWarning: overlappingAbsence ? `Внимание: сотрудник находится в статусе «${overlappingAbsence.title}» с ${overlappingAbsence.startDate} по ${overlappingAbsence.endDate}` : null
        };
      }, [formEmployee, formStartDate, formEndDate, events]);

      const handleCreateSave = () => {
        if (conflictCheck.hardConflict) return;
        const startDay = parseInt(formStartDate.split('-')[2], 10);
        const endDay = parseInt(formEndDate.split('-')[2], 10);

        const newPlan = {
          id: `plan-${Date.now()}`,
          type: 'planning',
          title: formTitle || 'Новое планирование работ',
          employeeId: formEmployee,
          coEmployeeIds: [],
          startDate: formStartDate,
          endDate: formEndDate,
          startDay: isNaN(startDay) ? 3 : startDay,
          endDay: isNaN(endDay) ? 4 : endDay,
          deal: { id: 1042, title: formDeal },
          company: 'Клиент из CRM',
          task: { id: 4600 + Math.floor(Math.random() * 100), title: 'Задача инженеру создана БП', status: 'Ждет выполнения', overdue: false },
          trip: null,
          report: { id: null, status: 'не предоставлен', date: null, badge: 'bg-rose-100 text-rose-800 border-rose-300' },
          description: 'Создано из графика планирований сотрудников.',
          needAct: true
        };

        setEvents(prev => [...prev, newPlan]);
        setIsCreateOpen(false);
        setFormTitle('');
      };

      const filteredEvents = useMemo(() => {
        return events.filter(e => {
          if (dealFilterMode && e.type === 'planning' && e.deal?.id !== 1042) return false;
          if (searchQuery.trim()) {
            const q = searchQuery.toLowerCase();
            const matchTitle = e.title.toLowerCase().includes(q);
            const matchDeal = e.deal?.title.toLowerCase().includes(q);
            if (!matchTitle && !matchDeal) return false;
          }
          return true;
        });
      }, [events, dealFilterMode, searchQuery]);

      return (
        <div className="min-h-screen flex flex-col bg-[#eef2f5] text-slate-800">
          <header className="bg-white border-b border-slate-200 px-6 py-3 flex items-center justify-between shadow-sm sticky top-0 z-30">
            <div className="flex items-center space-x-3">
              <div className="w-8 h-8 rounded bg-[#00a2e8] flex items-center justify-center text-white font-bold text-sm shadow-sm">
                24
              </div>
              <div>
                <div className="flex items-center space-x-2">
                  <h1 className="font-semibold text-lg text-slate-900">График планирований сотрудников</h1>
                  <span className="px-2 py-0.5 text-xs font-medium rounded bg-blue-100 text-blue-700">v0.2 согласовано</span>
                </div>
                <div className="text-xs text-slate-400">Синхронизация со Списком 47, Задачами, БП 39 и Отчетами 259</div>
              </div>
            </div>

            <div className="flex items-center space-x-3">
              <button 
                onClick={() => setDealFilterMode(!dealFilterMode)}
                className={`px-3 py-1.5 text-xs font-medium rounded border transition-colors ${dealFilterMode ? 'bg-amber-500 text-white border-amber-600 shadow-sm' : 'bg-slate-50 text-slate-700 border-slate-300 hover:bg-slate-100'}`}
              >
                {dealFilterMode ? '✓ Встройка в Сделку №1042' : 'Режим встройки в Сделку (FR-41)'}
              </button>

              <button 
                onClick={() => { setIsCreateOpen(true); setConflictOverride(false); }}
                className="px-4 py-1.5 bg-[#00a2e8] hover:bg-[#008fcb] text-white text-xs font-semibold rounded shadow-sm flex items-center space-x-1.5 transition-all"
              >
                <span className="text-sm font-bold">+</span>
                <span>Запланировать выезд</span>
              </button>
            </div>
          </header>

          <div className="bg-white border-b border-slate-200 px-6 py-2.5 flex flex-wrap items-center justify-between gap-3 text-xs">
            <div className="flex items-center space-x-4">
              <div className="inline-flex rounded-md shadow-sm border border-slate-300 overflow-hidden bg-slate-50 p-0.5">
                {['День', 'Неделя', 'Месяц', 'Год'].map(mode => (
                  <button
                    key={mode}
                    onClick={() => setViewMode(mode)}
                    className={`px-3 py-1 font-medium transition-colors ${viewMode === mode ? 'bg-white text-blue-600 shadow-sm rounded' : 'text-slate-600 hover:text-slate-900'}`}
                  >
                    {mode}
                  </button>
                ))}
              </div>

              <div className="flex items-center space-x-1">
                <button className="p-1 rounded hover:bg-slate-100 text-slate-500 border border-slate-200">◀</button>
                <button className="px-2.5 py-1 rounded hover:bg-slate-100 text-slate-700 font-medium border border-slate-200">Сегодня</button>
                <button className="p-1 rounded hover:bg-slate-100 text-slate-500 border border-slate-200">▶</button>
                <span className="ml-2 font-semibold text-slate-700 text-sm">Ноябрь 2026</span>
              </div>
            </div>

            <div className="flex items-center space-x-3">
              <div className="relative">
                <input 
                  type="text"
                  placeholder="Поиск по сделке или задаче..."
                  value={searchQuery}
                  onChange={e => setSearchQuery(e.target.value)}
                  className="w-64 pl-7 pr-3 py-1 text-xs border border-slate-300 rounded focus:outline-none focus:border-blue-500"
                />
                <span className="absolute left-2 top-1.5 text-slate-400">🔍</span>
              </div>

              <div className="hidden xl:flex items-center space-x-3 text-[11px] text-slate-600 border-l pl-4 border-slate-200">
                <div className="flex items-center space-x-1">
                  <span className="w-3 h-3 rounded bg-blue-500 inline-block"></span>
                  <span>Исполнитель</span>
                </div>
                <div className="flex items-center space-x-1">
                  <span className="w-3 h-3 rounded border border-dashed border-blue-500 bg-blue-50 inline-block"></span>
                  <span>Соисполнитель</span>
                </div>
                <div className="flex items-center space-x-1">
                  <span className="w-3 h-3 rounded bg-amber-200 border border-amber-400 inline-block"></span>
                  <span>Отпуск</span>
                </div>
                <div className="flex items-center space-x-1">
                  <span className="w-3 h-3 rounded bg-rose-200 border border-rose-400 inline-block"></span>
                  <span>Больничный</span>
                </div>
              </div>
            </div>
          </div>

          <main className="flex-1 p-6 overflow-x-auto custom-scrollbar">
            <div className="bg-white rounded-lg shadow-sm border border-slate-200 min-w-[1100px] overflow-hidden">
              <div className="flex border-b border-slate-200 bg-slate-50 sticky top-0 z-10 text-xs font-semibold text-slate-600">
                <div className="w-72 p-3 border-r border-slate-200 shrink-0 bg-slate-100 flex items-center justify-between">
                  <span>Сотрудники / Подразделения</span>
                  <span className="text-[10px] text-slate-400 font-normal">FR-01..05</span>
                </div>
                <div className="flex-1 grid grid-cols-14 divide-x divide-slate-200">
                  {daysData.map(d => (
                    <div 
                      key={d.day} 
                      className={`p-2 text-center flex flex-col justify-center ${d.isToday ? 'bg-blue-50/80 text-blue-700 font-bold' : d.isWeekend ? 'bg-slate-100/70 text-slate-400' : ''}`}
                    >
                      <span>{d.label}</span>
                      {d.isToday && <span className="text-[9px] uppercase tracking-wider text-blue-600">сегодня</span>}
                    </div>
                  ))}
                </div>
              </div>

              <div>
                {departments.map(dep => {
                  const isCollapsed = collapsedDeps[dep.id];
                  return (
                    <div key={dep.id} className="border-b border-slate-200 last:border-b-0">
                      <div 
                        onClick={() => toggleDep(dep.id)}
                        className="bg-slate-100/80 hover:bg-slate-200/70 px-4 py-2 flex items-center justify-between cursor-pointer transition-colors border-b border-slate-200"
                      >
                        <div className="flex items-center space-x-2 font-semibold text-xs text-slate-700">
                          <span className="text-slate-400 text-[10px]">{isCollapsed ? '▶' : '▼'}</span>
                          <span>{dep.name}</span>
                          <span className="bg-white px-1.5 py-0.5 rounded text-[10px] text-slate-500 font-normal border border-slate-200">
                            {dep.employees.length} чел.
                          </span>
                        </div>
                        <span className="text-[11px] text-slate-400">{isCollapsed ? 'развернуть' : 'свернуть'}</span>
                      </div>

                      {!isCollapsed && dep.employees.map(emp => (
                        <div key={emp.id} className="flex border-b border-slate-100 last:border-b-0 hover:bg-slate-50/40 transition-colors group">
                          <div className="w-72 p-3 border-r border-slate-200 shrink-0 flex items-center space-x-3 bg-white group-hover:bg-slate-50/70">
                            <div className={`w-8 h-8 rounded-full ${emp.color} text-white flex items-center justify-center text-xs font-bold shrink-0 shadow-sm`}>
                              {emp.avatar}
                            </div>
                            <div className="min-w-0">
                              <div className="text-xs font-medium text-slate-800 truncate">{emp.name}</div>
                              <div className="text-[10px] text-slate-400 truncate">{emp.role}</div>
                            </div>
                          </div>

                          <div className="flex-1 grid grid-cols-14 divide-x divide-slate-100 relative h-16 bg-white">
                            {daysData.map(d => (
                              <div 
                                key={d.day} 
                                className={`h-full ${d.isToday ? 'bg-blue-50/30' : d.isWeekend ? 'bg-slate-50/70' : ''}`}
                              />
                            ))}

                            {filteredEvents
                              .filter(e => e.employeeId === emp.id || (e.coEmployeeIds && e.coEmployeeIds.includes(emp.id)))
                              .map(ev => {
                                const isCoEmployee = ev.employeeId !== emp.id;
                                const colStart = ev.startDay - 1;
                                const span = (ev.endDay - ev.startDay) + 1;
                                const leftPercent = (colStart / 14) * 100;
                                const widthPercent = (span / 14) * 100;

                                if (ev.type === 'vacation') {
                                  return (
                                    <div 
                                      key={ev.id}
                                      onClick={() => setSelectedEvent(ev)}
                                      style={{ left: `${leftPercent}%`, width: `${widthPercent}%` }}
                                      className="absolute top-2 bottom-2 vacation-pattern border border-amber-300 rounded px-2 py-1 text-[11px] text-amber-900 font-medium cursor-pointer shadow-sm flex items-center justify-between z-10 hover:brightness-95"
                                    >
                                      <span className="truncate">🌴 {ev.title}</span>
                                    </div>
                                  );
                                }

                                if (ev.type === 'sick') {
                                  return (
                                    <div 
                                      key={ev.id}
                                      onClick={() => setSelectedEvent(ev)}
                                      style={{ left: `${leftPercent}%`, width: `${widthPercent}%` }}
                                      className="absolute top-2 bottom-2 sick-pattern border border-rose-300 rounded px-2 py-1 text-[11px] text-rose-900 font-medium cursor-pointer shadow-sm flex items-center justify-between z-10 hover:brightness-95"
                                    >
                                      <span className="truncate">💊 {ev.title}</span>
                                    </div>
                                  );
                                }

                                return (
                                  <div 
                                    key={ev.id}
                                    onClick={() => setSelectedEvent(ev)}
                                    style={{ left: `${leftPercent}%`, width: `${widthPercent}%` }}
                                    className={`absolute top-2 bottom-2 rounded px-2.5 py-1 text-[11px] cursor-pointer shadow-sm flex flex-col justify-between z-10 transition-transform hover:-translate-y-0.5 ${
                                      isCoEmployee 
                                        ? 'bg-blue-50 border-2 border-dashed border-blue-400 text-blue-900' 
                                        : 'bg-[#00a2e8] text-white'
                                    }`}
                                  >
                                    <div className="flex items-center justify-between space-x-1">
                                      <span className="font-semibold truncate">
                                        {isCoEmployee ? `[Соисп] ${ev.title}` : ev.title}
                                      </span>
                                      {ev.trip && <span title="Оформлена командировка БП 39" className="text-[10px]">✈️</span>}
                                      {ev.task?.overdue && <span title="Задача инженера просрочена!" className="text-[10px] animate-pulse">⚠️</span>}
                                    </div>

                                    <div className="flex items-center justify-between text-[9px] opacity-90">
                                      <span className="truncate">{ev.deal?.title}</span>
                                      <span className={`px-1 rounded text-[8px] font-medium ${isCoEmployee ? 'bg-blue-200 text-blue-900' : 'bg-white/20 text-white'}`}>
                                        {ev.report?.status === 'принят' ? '✓ Отчет' : 'Отчет: ' + ev.report?.status}
                                      </span>
                                    </div>
                                  </div>
                                );
                              })
                            }
                          </div>
                        </div>
                      ))}
                    </div>
                  );
                })}
              </div>
            </div>
          </main>

          {selectedEvent && (
            <div className="fixed inset-0 z-50 overflow-hidden flex justify-end bg-black/40 backdrop-blur-sm">
              <div className="w-full max-w-xl bg-white h-full shadow-2xl flex flex-col">
                <div className="px-6 py-4 bg-slate-900 text-white flex items-center justify-between">
                  <div>
                    <span className="text-xs text-blue-400 font-mono">
                      {selectedEvent.type === 'planning' ? `ПЛАНИРОВАНИЕ #${selectedEvent.id.toUpperCase()}` : 'ШТАТНОЕ ОТСУТСТВИЕ'}
                    </span>
                    <h2 className="text-base font-bold text-white mt-0.5">{selectedEvent.title}</h2>
                  </div>
                  <button 
                    onClick={() => setSelectedEvent(null)}
                    className="w-8 h-8 rounded-full bg-slate-800 hover:bg-slate-700 flex items-center justify-center text-slate-300 text-lg"
                  >
                    ✕
                  </button>
                </div>

                <div className="flex-1 overflow-y-auto p-6 space-y-5 text-xs text-slate-700">
                  {selectedEvent.type === 'planning' && (
                    <div className="p-4 bg-blue-50/70 border border-blue-200 rounded-lg space-y-3">
                      <div className="font-semibold text-blue-950 flex items-center justify-between text-xs">
                        <span>🔗 Связи с сущностями Битрикс24</span>
                        <span className="text-[10px] text-blue-600 bg-blue-100 px-2 py-0.5 rounded">Список ID 47</span>
                      </div>

                      <div className="grid grid-cols-2 gap-2 text-[11px]">
                        <div className="bg-white p-2 rounded border border-blue-100">
                          <span className="text-slate-400 block text-[10px]">Сделка CRM (FR-21, 45)</span>
                          <span className="font-medium text-blue-700 hover:underline cursor-pointer">{selectedEvent.deal?.title}</span>
                        </div>
                        <div className="bg-white p-2 rounded border border-blue-100">
                          <span className="text-slate-400 block text-[10px]">Компания</span>
                          <span className="font-medium text-slate-800">{selectedEvent.company}</span>
                        </div>
                        <div className="bg-white p-2 rounded border border-blue-100">
                          <span className="text-slate-400 block text-[10px]">Задача инженеру (FR-46..47)</span>
                          <div className="flex items-center justify-between">
                            <span className="font-medium text-blue-700 hover:underline cursor-pointer">#{selectedEvent.task?.id} {selectedEvent.task?.title}</span>
                          </div>
                          <span className={`inline-block mt-1 px-1.5 py-0.5 rounded text-[9px] font-semibold ${selectedEvent.task?.overdue ? 'bg-rose-100 text-rose-700' : 'bg-slate-100 text-slate-600'}`}>
                            {selectedEvent.task?.status} {selectedEvent.task?.overdue && '• ПРОСРОЧЕНА'}
                          </span>
                        </div>
                        <div className="bg-white p-2 rounded border border-blue-100">
                          <span className="text-slate-400 block text-[10px]">Командировка (БП ID 39)</span>
                          {selectedEvent.trip ? (
                            <span className="font-medium text-slate-800">{selectedEvent.trip.number} ({selectedEvent.trip.status})</span>
                          ) : (
                            <button className="text-[10px] text-blue-600 hover:underline font-medium">+ Оформить командировку (FR-48)</button>
                          )}
                        </div>
                      </div>

                      <div className="bg-white p-2.5 rounded border border-blue-100 flex items-center justify-between">
                        <div>
                          <span className="text-slate-400 block text-[10px]">Отчет по выезду (Список 259, FR-52..57)</span>
                          <span className="font-semibold text-slate-800">Статус: {selectedEvent.report?.status}</span>
                          {selectedEvent.report?.date && <span className="text-slate-400 text-[10px] ml-2">Сдан: {selectedEvent.report.date}</span>}
                        </div>
                        <span className={`px-2 py-1 rounded text-[10px] font-semibold border ${selectedEvent.report?.badge}`}>
                          {selectedEvent.report?.status === 'принят' ? '✓ Принят' : 'В работе'}
                        </span>
                      </div>
                    </div>
                  )}

                  <div className="space-y-3">
                    <div>
                      <span className="text-slate-400 block text-[10px]">Период выполнения:</span>
                      <span className="font-semibold text-slate-800">{selectedEvent.startDate} — {selectedEvent.endDate} (Целый рабочий день)</span>
                    </div>

                    <div>
                      <span className="text-slate-400 block text-[10px]">Основной исполнитель (FR-24):</span>
                      <span className="font-semibold text-slate-800">
                        {departments.flatMap(d => d.employees).find(e => e.id === selectedEvent.employeeId)?.name}
                      </span>
                    </div>

                    {selectedEvent.coEmployeeIds && selectedEvent.coEmployeeIds.length > 0 && (
                      <div>
                        <span className="text-slate-400 block text-[10px]">Соисполнители (FR-23):</span>
                        <div className="flex flex-wrap gap-1 mt-1">
                          {selectedEvent.coEmployeeIds.map(cid => (
                            <span key={cid} className="bg-slate-100 text-slate-700 px-2 py-0.5 rounded text-[11px] border border-slate-200">
                              {departments.flatMap(d => d.employees).find(e => e.id === cid)?.name}
                            </span>
                          ))}
                        </div>
                      </div>
                    )}

                    <div>
                      <span className="text-slate-400 block text-[10px]">Описание планируемых работ:</span>
                      <p className="p-3 bg-slate-50 border border-slate-200 rounded mt-1 text-slate-700 leading-relaxed">
                        {selectedEvent.description}
                      </p>
                    </div>

                    <div>
                      <span className="text-slate-400 block text-[10px]">Чек-лист инженера:</span>
                      <ul className="mt-1 space-y-1 text-[11px]">
                        <li className="flex items-center space-x-2">
                          <input type="checkbox" defaultChecked className="rounded text-blue-600" />
                          <span>Проверка наличия расходных материалов и кабелей</span>
                        </li>
                        <li className="flex items-center space-x-2">
                          <input type="checkbox" defaultChecked className="rounded text-blue-600" />
                          <span>Согласование допуска на объект с заказчиком</span>
                        </li>
                        <li className="flex items-center space-x-2">
                          <input type="checkbox" className="rounded text-blue-600" />
                          <span>Подписание двухстороннего акта выполненных работ</span>
                        </li>
                      </ul>
                    </div>
                  </div>
                </div>

                <div className="px-6 py-3 bg-slate-50 border-t border-slate-200 flex items-center justify-between">
                  <button 
                    onClick={() => {
                      if (confirm('Отменить и удалить планирование?')) {
                        setEvents(prev => prev.filter(e => e.id !== selectedEvent.id));
                        setSelectedEvent(null);
                      }
                    }}
                    className="text-rose-600 hover:text-rose-800 font-medium"
                  >
                    Удалить планирование
                  </button>
                  <button 
                    onClick={() => setSelectedEvent(null)}
                    className="px-4 py-1.5 bg-slate-800 hover:bg-slate-900 text-white font-medium rounded shadow-sm"
                  >
                    Закрыть
                  </button>
                </div>
              </div>
            </div>
          )}

          {isCreateOpen && (
            <div className="fixed inset-0 z-50 overflow-hidden flex items-center justify-center bg-black/50 backdrop-blur-sm p-4">
              <div className="bg-white rounded-lg shadow-2xl max-w-lg w-full overflow-hidden border border-slate-200">
                <div className="px-6 py-4 bg-slate-900 text-white flex items-center justify-between">
                  <div>
                    <h3 className="font-bold text-sm">Новое рабочее планирование</h3>
                    <div className="text-[11px] text-slate-400">Создание записи в Списке 47 без предварительного согласования</div>
                  </div>
                  <button onClick={() => setIsCreateOpen(false)} className="text-slate-400 hover:text-white">✕</button>
                </div>

                <div className="p-6 space-y-4 text-xs">
                  <div>
                    <label className="block font-semibold text-slate-700 mb-1">Основной исполнитель (FR-22, 24):</label>
                    <select 
                      value={formEmployee} 
                      onChange={e => setFormEmployee(e.target.value)}
                      className="w-full p-2 border border-slate-300 rounded focus:border-blue-500 focus:outline-none"
                    >
                      {departments.flatMap(d => d.employees).map(e => (
                        <option key={e.id} value={e.id}>{e.name} — {e.role}</option>
                      ))}
                    </select>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block font-semibold text-slate-700 mb-1">Дата начала:</label>
                      <input 
                        type="date" 
                        value={formStartDate} 
                        onChange={e => setFormStartDate(e.target.value)}
                        className="w-full p-2 border border-slate-300 rounded focus:border-blue-500 focus:outline-none" 
                      />
                    </div>
                    <div>
                      <label className="block font-semibold text-slate-700 mb-1">Дата окончания:</label>
                      <input 
                        type="date" 
                        value={formEndDate} 
                        onChange={e => setFormEndDate(e.target.value)}
                        className="w-full p-2 border border-slate-300 rounded focus:border-blue-500 focus:outline-none" 
                      />
                    </div>
                  </div>

                  <div>
                    <label className="block font-semibold text-slate-700 mb-1">Сделка CRM (Обязательно, FR-21):</label>
                    <input 
                      type="text" 
                      value={formDeal} 
                      onChange={e => setFormDeal(e.target.value)}
                      className="w-full p-2 border border-slate-300 rounded focus:border-blue-500 focus:outline-none font-medium text-blue-900 bg-blue-50/50" 
                    />
                  </div>

                  <div>
                    <label className="block font-semibold text-slate-700 mb-1">Название / Описание работ:</label>
                    <input 
                      type="text" 
                      placeholder="Например: Выездная диагностика коммутации и калибровка звука"
                      value={formTitle} 
                      onChange={e => setFormTitle(e.target.value)}
                      className="w-full p-2 border border-slate-300 rounded focus:border-blue-500 focus:outline-none" 
                    />
                  </div>

                  {conflictCheck.hardConflict && (
                    <div className="p-3 bg-rose-50 border border-rose-300 rounded text-rose-800 text-[11px] flex items-start space-x-2">
                      <span className="text-base leading-none">⛔</span>
                      <div>
                        <div className="font-bold">Блокировка сохранения (FR-34):</div>
                        <div>{conflictCheck.hardConflict}</div>
                        <div className="text-[10px] text-rose-600 mt-1">Один сотрудник не может одновременно участвовать в нескольких планированиях. Измените даты или выберите другого инженера.</div>
                      </div>
                    </div>
                  )}

                  {!conflictCheck.hardConflict && conflictCheck.absenceWarning && (
                    <div className="p-3 bg-amber-50 border border-amber-300 rounded text-amber-900 text-[11px] flex items-start space-x-2">
                      <span className="text-base leading-none">⚠️</span>
                      <div>
                        <div className="font-bold">Предупреждение об отсутствии (FR-37..39):</div>
                        <div>{conflictCheck.absenceWarning}</div>
                        <label className="flex items-center space-x-2 mt-2 cursor-pointer font-medium text-amber-800">
                          <input 
                            type="checkbox" 
                            checked={conflictOverride} 
                            onChange={e => setConflictOverride(e.target.checked)}
                            className="rounded text-amber-600" 
                          />
                          <span>Подтвердить создание поверх отсутствия (FR-39)</span>
                        </label>
                      </div>
                    </div>
                  )}
                </div>

                <div className="px-6 py-3 bg-slate-50 border-t border-slate-200 flex items-center justify-end space-x-3">
                  <button 
                    onClick={() => setIsCreateOpen(false)}
                    className="px-4 py-1.5 border border-slate-300 hover:bg-slate-100 rounded text-slate-700 font-medium"
                  >
                    Отмена
                  </button>

                  <button 
                    onClick={handleCreateSave}
                    disabled={!!conflictCheck.hardConflict || (!!conflictCheck.absenceWarning && !conflictOverride)}
                    className={`px-4 py-1.5 rounded font-semibold text-white shadow-sm transition-all ${
                      conflictCheck.hardConflict || (conflictCheck.absenceWarning && !conflictOverride)
                        ? 'bg-slate-300 cursor-not-allowed text-slate-500'
                        : 'bg-[#00a2e8] hover:bg-[#008fcb]'
                    }`}
                  >
                    Сохранить планирование
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
